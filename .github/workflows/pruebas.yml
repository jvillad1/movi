# Las cuatro suites del repo, en cada PR — y la guarda del despliegue.
#
# **Por qué existe.** Hasta el 2026-09-03 este repo no tenía ninguna verificación automática: los
# cuatro comandos se corrían a mano, y lo que no se corría no se notaba. Eso costó caro — #131 dejó
# el build de Railway roto (`android.sdkDirectory` se resuelve en configuración y la imagen no tiene
# SDK), producción se quedó cuatro merges atrás, y nadie se enteró. Un merge acá NO es un despliegue,
# y el modo de falla es silencioso. **Nunca `./gradlew build`**: arrastra el APK y los links de iOS.
#
# ## Cómo está partido (vuelta 122, medido en `docs/ci/medicion-2026-11.md`)
#
# Antes era UN trabajo que compilaba y probaba todo en serie con `--rerun-tasks`: 6 a 10 min, y otra
# vez entera en el push a master. Ahora:
#
# - **`suite`** (matriz, en paralelo, cada uno en su máquina): `:core:jvmTest`, `:server:test`,
#   `:shared:testDebugUnitTest` en dos trozos (`-Pmovi.trozoDePruebas=i/2`: cada clase cae en
#   exactamente un trozo por su nombre, ver `build.gradle.kts` de la raíz) y la web
#   (`:shared:compileKotlinWasmJs` + la guarda del despliegue) con la app de Android
#   (`:androidApp:compile*Kotlin`). Cada uno cuenta las pruebas que corrió en ESTA corrida y falla
#   si fueron cero.
# - **«Las cuatro suites»**: el check obligatorio de master (la protección de la rama exige ESTE
#   nombre). Espera a toda la matriz y falla si cualquier trozo falló, se canceló o no corrió.
#   `if: always()` a propósito: un trabajo **saltado** cuenta como verde para un check obligatorio,
#   así que este nunca se salta en un PR.
# - **Sin `--rerun-tasks`**: recompilaba todo y no usaba la caché. Las pruebas igual corren siempre,
#   porque el build lo exige (`Test` nunca al día ni de la caché, `build.gradle.kts` de la raíz); la
#   compilación sale de la caché de build (`--build-cache`) cuando sus entradas no cambiaron.
#
# ## El push a master ya no repite las pruebas
#
# Master está protegido con «Las cuatro suites» en verde **y la rama al día con master** (strict, que
# vale también para admins), y `publicar.sh` mergea con merge commit. Al día = la cabeza del PR ya
# contiene la punta de master, así que el árbol que queda en master tras el merge es **el mismo
# árbol** que probó el PR (la ref `pull/N/merge` de ese SHA). Volver a correr las pruebas ahí era
# correr dos veces lo mismo. Queda un **humo** (compila todo, prepara las suites sin correr pruebas
# y la guarda del despliegue) por dos razones: (1) setup-gradle solo ESCRIBE la caché de Gradle
# desde master —los PR la leen—, y sin una corrida en master los PR perderían la caché de
# dependencias y de compilación; (2) si algo se colara en master por fuera de un PR, al menos se ve
# que compila. Nadie lo espera: corre después del merge.
#
# ## Ramas `ci/…`
#
# Un push a una rama `ci/…` corre la matriz completa como un PR, sin abrir PR: sirve para medir el CI
# o para comprobar que una prueba rota lo pone en rojo. Bórralas al terminar.
name: Pruebas

on:
  pull_request:
  push:
    branches: [master, 'ci/**']

# Un PR que recibe tres pushes seguidos no necesita tres corridas: la última manda.
# Solo lee el repo: ni el checkout ni las cachés necesitan escribir en él.
permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.nombre }}
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ver «La caché de Gradle» en el humo, abajo.
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: pruebas
    strategy:
      # Que un trozo rojo no cancele los otros: cada uno dice lo suyo.
      fail-fast: false
      matrix:
        include:
          - nombre: core
            tareas: ':core:jvmTest'
            pruebas: true
          - nombre: server
            tareas: ':server:test'
            pruebas: true
          - nombre: shared (1/2)
            tareas: ':shared:testDebugUnitTest -Pmovi.trozoDePruebas=1/2'
            pruebas: true
            robolectric: true
          - nombre: shared (2/2)
            tareas: ':shared:testDebugUnitTest -Pmovi.trozoDePruebas=2/2'
            pruebas: true
            robolectric: true
          # Vuelta 109: `:androidApp` en sus dos canales (`directa`, el APK de Drive, y `play`, el de
          # Google Play sin SMS). Antes ningún paso compilaba el módulo de la app: un error ahí
          # (MainActivity, los Workers) se descubría al armar el APK.
          - nombre: web y app
            tareas: ':shared:compileKotlinWasmJs :androidApp:compileDirectaDebugKotlin :androidApp:compilePlayDebugKotlin'
            guarda: true

    steps:
      - uses: actions/checkout@v4

      # JetBrains Runtime 21, no un OpenJDK cualquiera: `gradle/gradle-daemon-jvm.properties`
      # pinta `toolchainVendor=jetbrains`, y con otro vendor el daemon no arranca.
      #
      # **Por qué se intenta dos veces.** Para resolver «la 21 de jetbrains» esta acción le pregunta a
      # la API de GitHub cuál es la última, y esa consulta se quedó sin cuota varias veces
      # («API rate limit exceeded»; el límite es por IP del runner). El reintento con pausa ataca eso,
      # que es transitorio; si el JDK de verdad no se puede instalar, el segundo intento falla igual.
      # `continue-on-error` va SOLO en el primero. `token`: sin él la pregunta va anónima y comparte
      # el cupo de 60 por hora con todos los runners de la misma IP (26 y 27-oct-2026).
      - id: jdk
        uses: actions/setup-java@v5
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      - name: Reintentar el JDK
        if: steps.jdk.outcome == 'failure'
        run: sleep 45

      - if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      # Los PR solo LEEN la caché de Gradle (dependencias + caché de build); la escribe el humo de
      # master. Es lo que setup-gradle hace por defecto fuera de la rama por defecto.
      - uses: gradle/actions/setup-gradle@v4

      # ## Los `android-all` de Robolectric (vuelta 116)
      #
      # Cada prueba Robolectric corre sobre un `android-all-instrumented` (90 a 200 MB por versión de
      # Android) que Robolectric baja de Maven Central y deja en `~/.m2/repository/org/robolectric`.
      # `setup-gradle` no guarda esa carpeta, así que cada corrida los bajaba de nuevo, y una descarga
      # caída tumbaba todas las pruebas de esa versión (vuelta 110, corrida 41462120406: 64 rojas,
      # `AssertionError at MavenArtifactFetcher.java:129`).
      #
      # 1. La carpeta se restaura entre corridas. La llave lleva la versión de Robolectric y la lista
      #    de jars que había al guardarla; se restaura la más reciente de esa versión.
      # 2. Antes de las pruebas se baja lo que falte, con reintentos y la huella SHA-512 de Maven
      #    Central. Si falla, Robolectric los baja como siempre. Las tres son las que Robolectric 4.14.1
      #    pide para las SDK de la suite (34, la mayoría; 35, las clases sin `sdk`; 24, la mínima).
      # 3. Al final se guarda solo si la lista de jars cambió, y aunque las pruebas fallen.
      - name: La versión de Robolectric
        if: matrix.robolectric
        id: robolectric
        run: echo "version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restaurar los android-all de Robolectric
        if: matrix.robolectric
        id: android-all
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ steps.robolectric.outputs.version }}-
          restore-keys: robolectric-android-all-${{ steps.robolectric.outputs.version }}-

      - name: Bajar los android-all que falten, con reintentos
        if: matrix.robolectric
        continue-on-error: true
        # Una descarga colgada no puede comerse el trabajo: 300 s por archivo y 10 min el paso.
        timeout-minutes: 10
        run: |
          base=https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented
          destino="$HOME/.m2/repository/org/robolectric/android-all-instrumented"
          for v in 14-robolectric-10818077-i7 15-robolectric-12650502-i7 7.0.0_r1-robolectric-r1-i7; do
            dir="$destino/$v"
            jar="android-all-instrumented-$v.jar"
            pom="android-all-instrumented-$v.pom"
            if [ -f "$dir/$jar" ]; then echo "ya estaba: $v"; continue; fi
            tmp=$(mktemp -d)
            ok=true
            for f in "$jar" "$jar.sha512" "$pom" "$pom.sha512"; do
              curl -fsSL --connect-timeout 20 --max-time 300 --retry 5 --retry-all-errors --retry-delay 10 -o "$tmp/$f" "$base/$v/$f" || { ok=false; break; }
            done
            if $ok \
              && [ "$(sha512sum "$tmp/$jar" | cut -c1-128)" = "$(cut -c1-128 "$tmp/$jar.sha512")" ] \
              && [ "$(sha512sum "$tmp/$pom" | cut -c1-128)" = "$(cut -c1-128 "$tmp/$pom.sha512")" ]; then
              mkdir -p "$dir" && mv "$tmp"/* "$dir"/ && echo "bajado: $v"
            else
              echo "::warning::No se pudo bajar $v; Robolectric lo intentará en la prueba"
            fi
            rm -rf "$tmp"
          done

      # La marca de tiempo contra la que «Cuántas pruebas corrieron» mira qué resultados son de ESTA
      # corrida (y no restos de una caché).
      - name: Marca de inicio
        run: touch "$RUNNER_TEMP/inicio-de-las-pruebas"

      # `movi.forksDePruebas=2`: dos JVM de prueba a la vez dentro del módulo (la máquina tiene 4
      # núcleos). `--build-cache`: la compilación sale de la caché si sus entradas no cambiaron; las
      # pruebas nunca (el build lo impide).
      - name: ${{ matrix.nombre }}
        run: ./gradlew --build-cache -Pmovi.forksDePruebas=2 ${{ matrix.tareas }}

      # **La guarda del despliegue, y el motivo por el que este archivo existe.**
      #
      # Railway construye el wasm SIN Android SDK. Gradle configura TODOS los módulos aunque solo se
      # le pida esta tarea, así que cualquier cosa que toque el SDK en configuración tumba el
      # despliegue entero — que es literalmente lo que pasó con #131 y nadie vio. `--dry-run` porque
      # lo que rompe es la **configuración**: tarda segundos y falla exactamente donde falló Railway.
      # `env -u` NO alcanza por sí solo: `android.sdkDirectory` lee PRIMERO `local.properties`
      # (medido contra el commit de #131: con el archivo, BUILD SUCCESSFUL; sin él, «SDK location not
      # found»), así que se mueve aparte. Un CI que no puede fallar es peor que no tener CI.
      - name: El despliegue no necesita el Android SDK
        if: matrix.guarda
        run: |
          restaurar() { [ -f local.properties.aparte ] && mv local.properties.aparte local.properties || true; }
          trap restaurar EXIT
          [ -f local.properties ] && mv local.properties local.properties.aparte || true
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :webApp:wasmJsBrowserDistribution --dry-run

      # Cuenta las pruebas de los resultados escritos DESPUÉS de la marca de inicio y lo deja en el
      # resumen de la corrida. Cero pruebas en un trabajo de pruebas es un error: un filtro o un trozo
      # mal armado pasaría en verde sin probar nada.
      - name: Cuántas pruebas corrieron
        if: ${{ !cancelled() && matrix.pruebas }}
        run: |
          set -o pipefail
          archivos=$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' -newer "$RUNNER_TEMP/inicio-de-las-pruebas" | sort)
          if [ -z "$archivos" ]; then
            echo "::error::${{ matrix.nombre }}: no corrió ninguna prueba"; exit 1
          fi
          echo "$archivos" | xargs cat | python3 -c '
          import re, sys
          t = f = e = s = c = 0
          for m in re.finditer(r"<testsuite\b[^>]*>", sys.stdin.read()):
              a = dict(re.findall(r"(\w+)=\"([^\"]*)\"", m.group(0)))
              t += int(a["tests"]); f += int(a["failures"]); e += int(a["errors"]); s += int(a["skipped"]); c += 1
          linea = f"{c} clases · {t} pruebas · {f + e} fallidas · {s} saltadas"
          print(linea)
          print(f"| ${{ matrix.nombre }} | {c} | {t} | {f + e} | {s} |")
          sys.exit(1 if t == 0 else 0)
          ' | tee pruebas.txt
          { echo "| Trabajo | Clases | Pruebas | Fallidas | Saltadas |"; echo "|---|---|---|---|---|"; tail -1 pruebas.txt; } >> "$GITHUB_STEP_SUMMARY"

      # Ver «Los android-all de Robolectric» arriba. `!cancelled()`: también cuando una prueba falla,
      # que es cuando más falta hace no volver a bajarlos. Solo si la lista de jars cambió desde lo
      # restaurado. `continue-on-error`: no guardar no es un error de las pruebas (y los dos trozos
      # pueden querer guardar la misma llave: el segundo no puede, y está bien).
      - name: Qué android-all quedaron
        id: android-all-al-final
        if: ${{ !cancelled() && matrix.robolectric }}
        env:
          VERSION: ${{ steps.robolectric.outputs.version }}
        run: |
          raiz="$HOME/.m2/repository/org/robolectric"
          jars=$(cd "$raiz" 2>/dev/null && find . -name '*.jar' | sort || true)
          echo "android-all al final:"; echo "$jars"
          # Cada jar contra su huella: uno que no coincida (o sin huella) no se guarda en la caché.
          sanos=true
          for j in $jars; do
            if [ ! -f "$raiz/$j.sha512" ] || [ "$(sha512sum "$raiz/$j" | cut -c1-128)" != "$(cut -c1-128 "$raiz/$j.sha512")" ]; then
              echo "::warning::$j no coincide con su .sha512: la caché no se guarda"
              sanos=false
            fi
          done
          lista=$(echo "$jars" | sha256sum | cut -c1-16)
          echo "key=robolectric-android-all-$VERSION-$lista" >> "$GITHUB_OUTPUT"
          if [ -n "$jars" ] && $sanos; then echo "hay=true" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar los android-all de Robolectric
        if: ${{ !cancelled() && matrix.robolectric && steps.android-all-al-final.outputs.hay == 'true' && steps.android-all-al-final.outputs.key != steps.android-all.outputs.cache-matched-key }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.android-all-al-final.outputs.key }}

      - name: Reportes de prueba
        if: failure() && matrix.pruebas
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ strategy.job-index }}
          path: |
            core/build/reports/tests/
            server/build/reports/tests/
            shared/build/reports/tests/
          retention-days: 7

  # El check obligatorio. NO cambiar el nombre: la protección de master lo pide así.
  las-cuatro-suites:
    name: Las cuatro suites
    needs: suite
    if: always() && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Toda la matriz en verde
        env:
          RESULTADO: ${{ needs.suite.result }}
        run: |
          echo "Resultado de la matriz: $RESULTADO"
          [ "$RESULTADO" = success ] || { echo "::error::Algún trabajo de la matriz no pasó ($RESULTADO)"; exit 1; }

  # Ver «El push a master ya no repite las pruebas» arriba.
  humo:
    name: Humo de master
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # **La caché de Gradle.** setup-gradle restaura primero una entrada del MISMO trabajo (por su
      # id) y recién después la más reciente de cualquier trabajo. Sin esto, los trabajos de la
      # matriz (`suite`) no tendrían ninguna de master con su id y tomarían la última de cualquiera
      # —casi siempre la de `paquete.yml`, que corre justo después de cada merge y no trae nada de
      # Android—, y bajarían de nuevo las dependencias de Android y de las pruebas en cada PR. Con el
      # mismo id («pruebas», el del trabajo de antes de la vuelta 122) los PR toman la del humo.
      GRADLE_BUILD_ACTION_CACHE_KEY_JOB: pruebas
    steps:
      - uses: actions/checkout@v4

      - id: jdk
        uses: actions/setup-java@v5
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      - name: Reintentar el JDK
        if: steps.jdk.outcome == 'failure'
        run: sleep 45

      - if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      # En master setup-gradle sí escribe la caché (dependencias y caché de build) que leen los PR.
      - uses: gradle/actions/setup-gradle@v4

      # Compila lo mismo que la matriz y prepara las tres suites SIN correr ninguna prueba
      # (`movi.soloPrepararLasPruebas`: compila las clases de prueba y resuelve el classpath con que
      # correrían). Así la caché que escribe trae todas las dependencias que usan los PR (también las
      # que solo se bajan para ejecutar pruebas) y la compilación de lo que no cambió. Las pruebas ya
      # corrieron en el PR, sobre este mismo árbol.
      - name: Compilar y preparar las pruebas, sin correrlas
        run: >
          ./gradlew --build-cache -Pmovi.soloPrepararLasPruebas=true
          :core:jvmTest
          :server:test
          :shared:testDebugUnitTest
          :shared:compileKotlinWasmJs
          :androidApp:compileDirectaDebugKotlin
          :androidApp:compilePlayDebugKotlin

      - name: El despliegue no necesita el Android SDK
        run: |
          restaurar() { [ -f local.properties.aparte ] && mv local.properties.aparte local.properties || true; }
          trap restaurar EXIT
          [ -f local.properties ] && mv local.properties local.properties.aparte || true
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :webApp:wasmJsBrowserDistribution --dry-run
