# Las cuatro suites del repo, en cada PR — y la guarda del despliegue.
#
# **Por qué existe.** Hasta hoy este repo no tenía ninguna verificación automática: los cuatro
# comandos se corrían a mano, y lo que no se corría no se notaba. El 2026-09-02 eso costó caro —
# #131 dejó el build de Railway roto (`android.sdkDirectory` se resuelve en configuración y la
# imagen no tiene SDK), producción se quedó cuatro merges atrás, y nadie se enteró: el build falla,
# Railway deja sirviendo la versión vieja y la app sigue contestando 200. Un merge acá NO es un
# despliegue, y el modo de falla es silencioso.
#
# Lo que se corre es exactamente lo que dice CLAUDE.md, ni más ni menos. **Nunca `./gradlew build`**:
# arrastra el APK y tareas de Android que no hacen falta para saber si algo se rompió.
name: Pruebas

on:
  pull_request:
  push:
    branches: [master]

# Un PR que recibe tres pushes seguidos no necesita tres corridas: la última manda.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Las cuatro suites
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # JetBrains Runtime 21, no un OpenJDK cualquiera: `gradle/gradle-daemon-jvm.properties`
      # pinta `toolchainVendor=jetbrains`, y con otro vendor el daemon no arranca.
      #
      # ## Por qué esto se intenta dos veces
      #
      # Para resolver «la 21 de jetbrains» esta acción le pregunta a la API de GitHub cuál es la
      # última, y esa consulta **se quedó sin cuota tres veces** (2026-09-09 dos veces, 2026-09-11
      # una más), siempre con el mismo error:
      #
      #     ##[error]API rate limit exceeded for 57.154.7.202.
      #
      # El límite es por IP del runner y lo comparten todos los trabajos que caen en esa máquina,
      # así que no depende de este repo ni se arregla esperando: las tres veces el arreglo fue
      # `gh run rerun --failed`, o sea una persona mirando. Un CI que hay que reintentar a mano no
      # es un CI, es un recordatorio.
      #
      # El reintento con pausa ataca exactamente eso, que es transitorio por definición: la cuota
      # se repone sola. No tapa un fallo real — si el JDK de verdad no se puede instalar, el
      # segundo intento falla igual y el trabajo se cae, que es lo correcto.
      #
      # `continue-on-error` va SOLO en el primer intento. En el segundo no: ahí sí tiene que
      # romper. Sin esa asimetría, un JDK que nunca se instala dejaría pasar el trabajo entero y
      # los pasos de abajo fallarían con un error que no explica nada.
      # `token`: para el JDK de JetBrains, setup-java le pregunta a la API de GitHub cuál es la
      # última versión. Sin token esa pregunta va anónima y comparte el cupo de 60 por hora con
      # todos los runners de la misma IP: el 26 y el 27-oct-2026 los dos intentos fallaron con
      # «API rate limit exceeded» y el trabajo se cayó sin correr ninguna prueba.
      - id: jdk
        uses: actions/setup-java@v5
        continue-on-error: true
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      - name: Reintentar el JDK
        if: steps.jdk.outcome == 'failure'
        run: sleep 45

      - if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      - uses: gradle/actions/setup-gradle@v4

      # ## Los `android-all` de Robolectric (vuelta 116)
      #
      # Cada prueba Robolectric corre sobre un `android-all-instrumented` (un jar de 90 a 200 MB por
      # versión de Android) que Robolectric baja de Maven Central la primera vez que lo necesita y deja
      # en `~/.m2/repository/org/robolectric`. `setup-gradle` guarda la caché de Gradle, no esa carpeta,
      # así que **cada corrida los bajaba de nuevo**, y una descarga caída tumba de una vez todas las
      # pruebas de esa versión: en la vuelta 110 (corrida 41462120406) fueron 64, ninguna relacionada
      # con el cambio, con `AssertionError at MavenArtifactFetcher.java:129` ← `IOException at
      # HttpURLConnection`.
      #
      # 1. La carpeta se restaura entre corridas. La llave lleva la versión de Robolectric (la de
      #    `libs.versions.toml`: otra versión pide otros jars) y la lista de jars que había al guardarla,
      #    y se restaura la más reciente de esa versión: así un juego incompleto (una corrida en que
      #    algo no bajó) no queda congelado, la corrida que lo completa guarda otra llave.
      # 2. Antes de las pruebas se baja lo que falte, con reintentos, y se verifica la huella SHA-512
      #    que publica Maven Central (el mismo chequeo que hace Robolectric). El paso no es obligatorio:
      #    si falla, o si una versión nueva de Robolectric pide otros jars, Robolectric los baja como
      #    siempre. Las tres son las que Robolectric 4.14.1 pide para las SDK de la suite (34, la de la
      #    mayoría; 35, la de las clases sin `sdk`; 24, la mínima): al subir Robolectric, mirar los
      #    nombres en `~/.m2/repository/org/robolectric/android-all-instrumented` después de una corrida.
      # 3. Al final se guarda solo si la lista de jars cambió, y aunque las pruebas fallen: Robolectric
      #    valida el SHA-512 antes de mover un jar a esa carpeta, así que ahí nunca queda uno a medio bajar.
      - name: La versión de Robolectric
        id: robolectric
        run: echo "version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - name: Restaurar los android-all de Robolectric
        id: android-all
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ steps.robolectric.outputs.version }}-
          restore-keys: robolectric-android-all-${{ steps.robolectric.outputs.version }}-

      - name: Bajar los android-all que falten, con reintentos
        continue-on-error: true
        run: |
          base=https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented
          destino="$HOME/.m2/repository/org/robolectric/android-all-instrumented"
          for v in 14-robolectric-10818077-i7 15-robolectric-12650502-i7 7.0.0_r1-robolectric-r1-i7; do
            dir="$destino/$v"
            jar="android-all-instrumented-$v.jar"
            pom="android-all-instrumented-$v.pom"
            if [ -f "$dir/$jar" ]; then echo "ya estaba: $v"; continue; fi
            tmp=$(mktemp -d)
            ok=true
            for f in "$jar" "$jar.sha512" "$pom" "$pom.sha512"; do
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$tmp/$f" "$base/$v/$f" || { ok=false; break; }
            done
            if $ok \
              && [ "$(sha512sum "$tmp/$jar" | cut -c1-128)" = "$(cut -c1-128 "$tmp/$jar.sha512")" ] \
              && [ "$(sha512sum "$tmp/$pom" | cut -c1-128)" = "$(cut -c1-128 "$tmp/$pom.sha512")" ]; then
              mkdir -p "$dir" && mv "$tmp"/* "$dir"/ && echo "bajado: $v"
            else
              echo "::warning::No se pudo bajar $v; Robolectric lo intentará en la prueba"
            fi
            rm -rf "$tmp"
          done

      # Vuelta 109: también compila `:androidApp` en sus dos canales (`directa`, el APK de Drive, y
      # `play`, el de Google Play sin SMS). Antes ningún paso compilaba el módulo de la app: un error
      # ahí (MainActivity, los Workers) se descubría al armar el APK.
      #
      # `--rerun-tasks` a propósito, aunque la caché lo haga parecer redundante. Este repo ya tuvo
      # una prueba en verde que no se estaba ejecutando; un CI que saltea los tests porque el caché
      # dice «up-to-date» es peor que no tener CI, porque además da confianza.
      - name: Las cuatro suites
        run: >
          ./gradlew --rerun-tasks
          :core:jvmTest
          :server:test
          :shared:testDebugUnitTest
          :shared:compileKotlinWasmJs
          :androidApp:compileDirectaDebugKotlin
          :androidApp:compilePlayDebugKotlin

      # **La guarda del despliegue, y el motivo por el que este archivo existe.**
      #
      # Railway construye el wasm SIN Android SDK. Gradle configura TODOS los módulos aunque solo se
      # le pida esta tarea, así que cualquier cosa que toque el SDK en configuración tumba el
      # despliegue entero — que es literalmente lo que pasó con #131 y nadie vio.
      #
      # `--dry-run` porque lo que rompe es la **configuración**, no la compilación: tarda segundos
      # en vez de los ~19 minutos del build real, y falla exactamente donde falló Railway.
      # `ANDROID_SDK_ROOT` también se limpia: el runner define las dos.
      # `env -u` NO alcanza por sí solo, y se comprobó: `android.sdkDirectory` lee PRIMERO
      # `local.properties`, así que en una máquina de desarrollo esta guarda pasa en verde con el
      # mismo archivo que tumbó el despliegue. Medido contra el commit de #131: con
      # `local.properties` presente da BUILD SUCCESSFUL; sin él, «SDK location not found».
      #
      # Hoy el runner no tiene ese archivo, así que la guarda funciona — pero funciona por una
      # AUSENCIA, no por una decisión. Moverlo la vuelve reproducible en cualquier máquina y evita
      # que un `local.properties` commiteado por error la convierta en un chequeo que pasa siempre.
      # Un CI que no puede fallar es peor que no tener CI: además da confianza.
      - name: El despliegue no necesita el Android SDK
        run: |
          restaurar() { [ -f local.properties.aparte ] && mv local.properties.aparte local.properties || true; }
          trap restaurar EXIT
          [ -f local.properties ] && mv local.properties local.properties.aparte || true
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :webApp:wasmJsBrowserDistribution --dry-run

      # Ver «Los android-all de Robolectric» arriba. `always()`: también cuando una prueba falla, que es
      # cuando más falta hace no volver a bajarlos. Solo si la lista de jars cambió desde lo restaurado
      # (si no, sería la misma llave). `continue-on-error`: no guardar no es un error de las pruebas.
      - name: Qué android-all quedaron
        id: android-all-al-final
        if: always()
        run: |
          jars=$(cd "$HOME/.m2/repository/org/robolectric" 2>/dev/null && find . -name '*.jar' | sort || true)
          echo "android-all al final:"; echo "$jars"
          lista=$(echo "$jars" | sha256sum | cut -c1-16)
          echo "key=robolectric-android-all-${{ steps.robolectric.outputs.version }}-$lista" >> "$GITHUB_OUTPUT"
          if [ -n "$jars" ]; then echo "hay=true" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar los android-all de Robolectric
        if: always() && steps.android-all-al-final.outputs.hay == 'true' && steps.android-all-al-final.outputs.key != steps.android-all.outputs.cache-matched-key
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.android-all-al-final.outputs.key }}

      - name: Reportes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            core/build/reports/tests/
            server/build/reports/tests/
            shared/build/reports/tests/
          retention-days: 7
