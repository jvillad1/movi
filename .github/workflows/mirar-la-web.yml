name: Mirar la web
on:
  push:
    branches: ['mirar/**']
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rm -f local.properties
      - run: DOCKER_BUILDKIT=1 docker build --progress=plain -t movi-diag . 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: docker-log, path: build.log, retention-days: 2 }
