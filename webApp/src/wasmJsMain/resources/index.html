<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movi</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="icons/movi-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Movi">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; }
        #ComposeTarget { width: 100vw; height: 100vh; display: block; }

        /* Native HTML login overlay — lets the browser's password manager
           save & autofill credentials (Compose renders to canvas, which the
           password manager can't see). */
        #login-overlay {
            position: fixed; inset: 0; z-index: 10;
            background: #121212;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        #login-overlay.hidden { display: none; }
        .lg-card { width: min(420px, 100%); }
        .lg-title { color: #EDEDED; font-size: 34px; font-weight: 700; text-align: center; letter-spacing: -0.5px; }
        .lg-sub { color: #9b9b9b; text-align: center; margin: 6px 0 26px; font-size: 15px; }
        .lg-box { background: #1c1c1e; border-radius: 16px; padding: 24px; }
        .lg-label { color: #8a8a8a; font-size: 13px; display: block; margin-bottom: 8px; }
        .lg-input {
            width: 100%; background: #0f0f0f; border: 1px solid #2a2a2a; border-radius: 10px;
            color: #EDEDED; font-size: 15px; padding: 14px; margin-bottom: 18px; outline: none;
        }
        .lg-input:focus { border-color: #C9B8FF; }
        .lg-err { color: #FFB4AB; font-size: 13px; min-height: 18px; margin-bottom: 8px; }
        .lg-btn {
            width: 100%; background: #C9B8FF; color: #1a1226; border: none; border-radius: 999px;
            padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .lg-btn:disabled { opacity: 0.6; cursor: default; }
        .lg-alt {
            display: block; width: 100%; margin-top: 16px; padding: 6px;
            background: none; border: none; color: #C9B8FF; font-size: 13px; text-align: center; cursor: pointer;
        }
        .lg-hidden { display: none; }
        .lg-note { color: #9b9b9b; font-size: 13px; line-height: 1.45; margin-bottom: 16px; }
        .lg-ok { color: #A8E6A1; font-size: 13px; line-height: 1.45; }
        .lg-ok:not(:empty) { margin-bottom: 14px; }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>

    <!-- Native login form (hidden by default; shown only when there is no session) -->
    <div id="login-overlay" class="hidden">
        <div class="lg-card">
            <div class="lg-title">Movi</div>
            <div class="lg-sub">Finanzas personales</div>
            <div class="lg-box">
                <!-- Panel 1: entrar (el de siempre) -->
                <div id="login-panel">
                    <div class="lg-ok" id="login-ok"></div>
                    <form id="login-form" autocomplete="on">
                        <label class="lg-label" for="login-email">Correo</label>
                        <input class="lg-input" id="login-email" name="email" type="email"
                               autocomplete="username" placeholder="tu@correo.com" required autocapitalize="none" spellcheck="false">
                        <label class="lg-label" for="login-password">Contraseña</label>
                        <input class="lg-input" id="login-password" name="password" type="password"
                               autocomplete="current-password" placeholder="••••••" required>
                        <div class="lg-err" id="login-err"></div>
                        <button class="lg-btn" id="login-btn" type="submit">Entrar</button>
                    </form>
                    <button class="lg-alt" id="forgot-link" type="button">¿Olvidaste tu contraseña?</button>
                    <button class="lg-alt" id="register-link" type="button">¿No tenés cuenta? Registrate</button>
                </div>

                <!-- Panel 2: pedir el enlace de recuperación -->
                <div id="forgot-panel" class="lg-hidden">
                    <div class="lg-note">Te enviamos un enlace para elegir una contraseña nueva. Vence en 1 hora y sirve una sola vez.</div>
                    <form id="forgot-form" autocomplete="on">
                        <label class="lg-label" for="forgot-email">Correo</label>
                        <input class="lg-input" id="forgot-email" name="email" type="email"
                               autocomplete="username" placeholder="tu@correo.com" required autocapitalize="none" spellcheck="false">
                        <div class="lg-err" id="forgot-err"></div>
                        <div class="lg-ok" id="forgot-ok"></div>
                        <button class="lg-btn" id="forgot-btn" type="submit">Enviar enlace</button>
                    </form>
                    <button class="lg-alt" id="forgot-back" type="button">Volver a entrar</button>
                </div>

                <!-- Panel 3: elegir contraseña nueva (solo con ?reset=… en la URL) -->
                <div id="reset-panel" class="lg-hidden">
                    <div class="lg-note">Elegí tu contraseña nueva.</div>
                    <form id="reset-form" autocomplete="on">
                        <label class="lg-label" for="reset-password">Contraseña nueva</label>
                        <input class="lg-input" id="reset-password" name="new-password" type="password"
                               autocomplete="new-password" placeholder="••••••••••••" required>
                        <label class="lg-label" for="reset-password2">Repetila</label>
                        <input class="lg-input" id="reset-password2" name="new-password-confirm" type="password"
                               autocomplete="new-password" placeholder="••••••••••••" required>
                        <div class="lg-err" id="reset-err"></div>
                        <button class="lg-btn" id="reset-btn" type="submit">Guardar contraseña</button>
                    </form>
                    <button class="lg-alt" id="reset-back" type="button">Volver a entrar</button>
                </div>

                <!-- Panel 4: crear cuenta. Vive acá, no en el Compose de abajo, por la misma
                     razón que el resto de esta capa: el `autocomplete` correcto (name,
                     username, new-password) es lo único que hace que el gestor de
                     contraseñas del navegador ofrezca guardar la cuenta recién creada. -->
                <div id="register-panel" class="lg-hidden">
                    <div class="lg-note">Creá tu cuenta para empezar a usar Movi.</div>
                    <form id="register-form" autocomplete="on">
                        <label class="lg-label" for="register-name">Nombre</label>
                        <input class="lg-input" id="register-name" name="name" type="text"
                               autocomplete="name" placeholder="Tu nombre" required>
                        <label class="lg-label" for="register-email">Correo</label>
                        <input class="lg-input" id="register-email" name="email" type="email"
                               autocomplete="username" placeholder="tu@correo.com" required autocapitalize="none" spellcheck="false">
                        <label class="lg-label" for="register-password">Contraseña</label>
                        <input class="lg-input" id="register-password" name="new-password" type="password"
                               autocomplete="new-password" placeholder="••••••••••••" required>
                        <label class="lg-label" for="register-password2">Repetila</label>
                        <input class="lg-input" id="register-password2" name="new-password-confirm" type="password"
                               autocomplete="new-password" placeholder="••••••••••••" required>
                        <div class="lg-err" id="register-err"></div>
                        <button class="lg-btn" id="register-btn" type="submit">Crear cuenta</button>
                    </form>
                    <button class="lg-alt" id="register-back" type="button">¿Ya tenés cuenta? Entrá</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            try {
                var overlay = document.getElementById('login-overlay');
                var emailEl = document.getElementById('login-email');
                var passEl = document.getElementById('login-password');
                var form = document.getElementById('login-form');
                var btn = document.getElementById('login-btn');
                var err = document.getElementById('login-err');

                // Pre-fill remembered email (survives logout via a dedicated key).
                var remembered = localStorage.getItem('remembered_email') || localStorage.getItem('user_email');
                if (remembered && emailEl) emailEl.value = remembered;

                // ── Recuperación de contraseña ─────────────────────────────
                // El enlace del correo apunta a la raíz de la PWA con ?reset=TOKEN. Si está,
                // se muestra el formulario de contraseña nueva aunque haya sesión guardada:
                // quien llega por acá justamente no puede entrar de la forma normal.
                var loginPanel = document.getElementById('login-panel');
                var forgotPanel = document.getElementById('forgot-panel');
                var resetPanel = document.getElementById('reset-panel');
                var registerPanel = document.getElementById('register-panel');
                var loginOk = document.getElementById('login-ok');
                var resetToken = new URLSearchParams(window.location.search).get('reset');

                function showPanel(which) {
                    loginPanel.classList.toggle('lg-hidden', which !== 'login');
                    forgotPanel.classList.toggle('lg-hidden', which !== 'forgot');
                    resetPanel.classList.toggle('lg-hidden', which !== 'reset');
                    registerPanel.classList.toggle('lg-hidden', which !== 'register');
                }

                // El servidor responde con el texto serializado como JSON ("…"). Se intenta
                // parsear y si no, se usa crudo: así el mensaje del servidor (que es el que
                // sabe el mínimo de caracteres real) llega tal cual a la persona.
                async function serverMessage(res, fallback) {
                    try {
                        var raw = await res.text();
                        if (!raw) return fallback;
                        try { var parsed = JSON.parse(raw); return typeof parsed === 'string' ? parsed : fallback; }
                        catch (e) { return raw; }
                    } catch (e) { return fallback; }
                }

                var hasToken = !!localStorage.getItem('auth_token');
                if (resetToken) {
                    overlay.classList.remove('hidden');
                    showPanel('reset');
                    setTimeout(function () { document.getElementById('reset-password').focus(); }, 50);
                } else if (!hasToken) {
                    overlay.classList.remove('hidden');
                    // focus password if email is already known, else email
                    setTimeout(function () { (remembered ? passEl : emailEl).focus(); }, 50);
                }

                form.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    err.textContent = '';
                    btn.disabled = true; btn.textContent = 'Entrando…';
                    var email = (emailEl.value || '').trim();
                    var password = passEl.value || '';
                    try {
                        var res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: email, password: password })
                        });
                        if (!res.ok) {
                            err.textContent = res.status === 401
                                ? 'Correo o contraseña incorrectos'
                                : 'No se pudo entrar (' + res.status + ')';
                            btn.disabled = false; btn.textContent = 'Entrar';
                            return;
                        }
                        var data = await res.json();
                        localStorage.setItem('auth_token', data.token);
                        localStorage.setItem('user_id', data.userId);
                        localStorage.setItem('user_email', data.email);
                        localStorage.setItem('user_name', data.name);
                        localStorage.setItem('remembered_email', data.email);
                        // Reload so the browser offers to save the password and the
                        // wasm app boots straight into the dashboard with the session.
                        window.location.reload();
                    } catch (ex) {
                        err.textContent = 'No se pudo conectar. Probá de nuevo.';
                        btn.disabled = false; btn.textContent = 'Entrar';
                    }
                });

                // ── Pedir el enlace ────────────────────────────────────────
                var forgotEmailEl = document.getElementById('forgot-email');
                var forgotBtn = document.getElementById('forgot-btn');
                var forgotErr = document.getElementById('forgot-err');
                var forgotOk = document.getElementById('forgot-ok');

                document.getElementById('forgot-link').addEventListener('click', function () {
                    forgotEmailEl.value = (emailEl.value || '').trim() || remembered || '';
                    forgotErr.textContent = ''; forgotOk.textContent = '';
                    showPanel('forgot');
                    setTimeout(function () { forgotEmailEl.focus(); }, 50);
                });
                document.getElementById('forgot-back').addEventListener('click', function () { showPanel('login'); });

                document.getElementById('forgot-form').addEventListener('submit', async function (e) {
                    e.preventDefault();
                    forgotErr.textContent = ''; forgotOk.textContent = '';
                    forgotBtn.disabled = true; forgotBtn.textContent = 'Enviando…';
                    try {
                        var res = await fetch('/api/auth/password-reset/request', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: (forgotEmailEl.value || '').trim() })
                        });
                        // 202 es la MISMA respuesta exista o no el correo — a propósito, para no
                        // convertir esto en un buscador de cuentas. 503 es el servidor diciendo
                        // que no tiene cómo mandar correo; se muestra tal cual en vez de fingir.
                        if (res.status === 202) {
                            forgotOk.textContent = await serverMessage(res, 'Si el correo está registrado, te enviamos un enlace.');
                        } else if (res.status === 503) {
                            forgotErr.textContent = await serverMessage(res, 'El envío de correo no está configurado en este servidor.');
                        } else if (res.status === 429) {
                            forgotErr.textContent = 'Demasiados pedidos. Esperá unos minutos.';
                        } else {
                            forgotErr.textContent = 'No se pudo pedir el enlace (' + res.status + ')';
                        }
                    } catch (ex) {
                        forgotErr.textContent = 'No se pudo conectar. Probá de nuevo.';
                    }
                    forgotBtn.disabled = false; forgotBtn.textContent = 'Enviar enlace';
                });

                // ── Elegir contraseña nueva ────────────────────────────────
                var resetPassEl = document.getElementById('reset-password');
                var resetPass2El = document.getElementById('reset-password2');
                var resetBtn = document.getElementById('reset-btn');
                var resetErr = document.getElementById('reset-err');

                function backToLogin(message) {
                    // Saca el token de la barra de direcciones: ya se usó y no tiene por qué
                    // quedar en el historial ni en un enlace que alguien comparta sin pensar.
                    if (window.history && window.history.replaceState) {
                        window.history.replaceState({}, '', window.location.pathname);
                    }
                    loginOk.textContent = message || '';
                    showPanel('login');
                }
                document.getElementById('reset-back').addEventListener('click', function () { backToLogin(''); });

                document.getElementById('reset-form').addEventListener('submit', async function (e) {
                    e.preventDefault();
                    resetErr.textContent = '';
                    if (resetPassEl.value !== resetPass2El.value) {
                        resetErr.textContent = 'Las dos contraseñas no coinciden';
                        return;
                    }
                    resetBtn.disabled = true; resetBtn.textContent = 'Guardando…';
                    try {
                        var res = await fetch('/api/auth/password-reset/confirm', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: resetToken, newPassword: resetPassEl.value })
                        });
                        if (res.ok) {
                            // Un reset NO deja una sesión iniciada: hay que entrar con la nueva.
                            // Se limpia la sesión ENTERA de este navegador, no solo el token:
                            // borrar `auth_token` y dejar `user_id`/`user_email`/`user_name`
                            // deja media identidad colgada que la app de abajo puede leer y
                            // mostrar como si hubiera sesión. Es una limpieza local, NO
                            // revocación: los JWT de movi no se revocan (ver AuthRoutes.kt).
                            ['auth_token', 'user_id', 'user_email', 'user_name']
                                .forEach(function (k) { localStorage.removeItem(k); });
                            // `remembered_email` se conserva a propósito: no es credencial ni
                            // sesión, es el correo para prellenar el formulario de entrada —
                            // justo lo que la persona necesita en el paso siguiente.
                            resetPassEl.value = ''; resetPass2El.value = '';
                            backToLogin('Listo, tu contraseña quedó actualizada. Entrá con la nueva.');
                        } else if (res.status === 429) {
                            resetErr.textContent = 'Demasiados intentos. Esperá unos minutos.';
                        } else {
                            // El servidor es la autoridad sobre el mínimo de caracteres y sobre
                            // si el enlace sirve: se muestra su mensaje, no uno inventado acá.
                            resetErr.textContent = await serverMessage(res, 'No se pudo guardar la contraseña (' + res.status + ')');
                        }
                    } catch (ex) {
                        resetErr.textContent = 'No se pudo conectar. Probá de nuevo.';
                    }
                    resetBtn.disabled = false; resetBtn.textContent = 'Guardar contraseña';
                });

                // ── Crear cuenta ───────────────────────────────────────────
                // Antes este botón escapaba al login de Compose (la única puerta al registro,
                // porque esta capa no sabía registrar). Ahora registra acá mismo, con los
                // `autocomplete` que hacen que el navegador ofrezca guardar la cuenta nueva —
                // que es la razón de ser de todo este overlay. El login de Compose de abajo
                // queda sin usar en la web (ver el `catch` de más abajo para la única salida).
                var nameEl = document.getElementById('register-name');
                var regEmailEl = document.getElementById('register-email');
                var regPassEl = document.getElementById('register-password');
                var regPass2El = document.getElementById('register-password2');
                var registerForm = document.getElementById('register-form');
                var registerBtn = document.getElementById('register-btn');
                var registerErr = document.getElementById('register-err');

                document.getElementById('register-link').addEventListener('click', function () {
                    // Mismo arrastre que "¿Olvidaste tu contraseña?": si ya escribió el correo
                    // en el login, no se lo hace escribir de nuevo.
                    regEmailEl.value = (emailEl.value || '').trim() || remembered || '';
                    registerErr.textContent = '';
                    showPanel('register');
                    setTimeout(function () { nameEl.focus(); }, 50);
                });
                document.getElementById('register-back').addEventListener('click', function () { showPanel('login'); });

                registerForm.addEventListener('submit', async function (e) {
                    e.preventDefault();
                    registerErr.textContent = '';
                    if (regPassEl.value !== regPass2El.value) {
                        registerErr.textContent = 'Las dos contraseñas no coinciden';
                        return;
                    }
                    registerBtn.disabled = true; registerBtn.textContent = 'Creando cuenta…';
                    try {
                        var res = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: (regEmailEl.value || '').trim(),
                                name: (nameEl.value || '').trim(),
                                password: regPassEl.value,
                            })
                        });
                        if (!res.ok) {
                            if (res.status === 409) {
                                // El servidor manda "Email already registered" en inglés (ver
                                // AuthRoutes.kt) — no se repite tal cual, se traduce, igual que
                                // el panel de login nunca muestra el "Invalid credentials" del 401.
                                registerErr.textContent = 'Ese correo ya tiene una cuenta. Entrá con tu contraseña.';
                            } else if (res.status === 429) {
                                registerErr.textContent = await serverMessage(res, 'Demasiados intentos. Esperá unos minutos.');
                            } else {
                                // 400 trae el mensaje de PasswordPolicy (:core, mínimo 12
                                // caracteres) — el servidor es la autoridad, se muestra tal cual
                                // en vez de duplicar la regla acá.
                                registerErr.textContent = await serverMessage(res, 'No se pudo crear la cuenta (' + res.status + ')');
                            }
                            registerBtn.disabled = false; registerBtn.textContent = 'Crear cuenta';
                            return;
                        }
                        var data = await res.json();
                        localStorage.setItem('auth_token', data.token);
                        localStorage.setItem('user_id', data.userId);
                        localStorage.setItem('user_email', data.email);
                        localStorage.setItem('user_name', data.name);
                        localStorage.setItem('remembered_email', data.email);
                        // Misma recarga deliberada que el submit del login: es lo que hace que
                        // el navegador ofrezca guardar la contraseña recién creada.
                        window.location.reload();
                    } catch (ex) {
                        registerErr.textContent = 'No se pudo conectar. Probá de nuevo.';
                        registerBtn.disabled = false; registerBtn.textContent = 'Crear cuenta';
                    }
                });
            } catch (ex) {
                // Red de seguridad, no el segundo login: si algo de este script explota (un
                // elemento que no aparece, una API del navegador que falta), el overlay se
                // esconde y el login de Compose de abajo queda como último recurso para que
                // nadie se quede afuera de su propia cuenta. No se toca a propósito — ver el
                // pedido que dio origen a este archivo.
                var o = document.getElementById('login-overlay');
                if (o) o.classList.add('hidden');
            }
        })();
    </script>
    <script src="push.js"></script>
    <script src="composeApp.js"></script>
</body>
</html>
