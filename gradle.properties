org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
# 8g: Kotlin/Native compiles in this daemon; the configuration cache links the iOS
# Compose frameworks in parallel and they OOM ("Java heap space") at 3g, and the
# two release (optimized) links still OOM at 6g when they run concurrently.
kotlin.daemon.jvmargs=-Xmx8192m
android.useAndroidX=true
android.nonTransitiveRClass=true
